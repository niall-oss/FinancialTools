[project]
name = "financials"
version = "0.1.0"
description = "Irish personal finance tools — build orchestration"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["build", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.14"
root = ["."]

[tool.ty.src]
include = ["build", "tests"]
